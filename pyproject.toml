[build-system]
requires = ["setuptools>=68.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzml-utils"
version = "0.1.0"
description = "Utilities for mzML mass spectrometry file processing, fragment ion calculation, and peak matching"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Longping Fu"},
]
keywords = ["mass spectrometry", "mzML", "proteomics", "glycoproteomics", "fragment ions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # The [xml] extra is required, not optional: reader.py does `from pyteomics import mzml`,
    # which pulls in pyteomics.xml -> lxml. pyteomics declares lxml only under its optional
    # extras, so a plain "pyteomics>=4.7" installs a package that cannot import mzml_utils at
    # all. It went unnoticed because lxml is usually already present from something else.
    "pyteomics[xml]>=4.7",
    "numpy>=1.20",
    # mzml_utils.structure -- protein structure database clients. Imported
    # lazily, so a spectrum-only script never pays for it.
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
# mzml_utils.structure.render -- glycoprotein figure panels. Imported lazily
# behind a module __getattr__, so a retrieval-only script never pays for these.
# PyMOL is deliberately NOT here: it is not pip-installable, so it is shelled
# out to and feature-detected with shutil.which().
render = [
    "matplotlib>=3.5",
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/longpingfu/mzml-utils"
Repository = "https://github.com/longpingfu/mzml-utils"
Issues = "https://github.com/longpingfu/mzml-utils/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits live public APIs (EBI/UniProt); deselect with -m 'not network'",
]
